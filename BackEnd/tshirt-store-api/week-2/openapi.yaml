openapi: 3.0.3
info:
  title: T-Shirt Store API
  description: |
    REST API for the T-Shirt Store capstone project.
    Supports three roles: Manager, Client, and Delivery Person.
  version: 1.0.0
  contact:
    name: Adrian

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication and password management
  - name: Products
    description: Product catalog (public + manager CRUD)
  - name: Product Variants
    description: Product variants (size + color + price + stock)
  - name: Categories
    description: Product categories
  - name: Addresses
    description: Customer shipping addresses
  - name: Cart
    description: Shopping cart (client only)
  - name: Orders
    description: Order management
  - name: Payments
    description: Stripe payment processing
  - name: Webhooks
    description: Stripe webhook handlers
  - name: Likes
    description: Product likes (client only)
  - name: Promo Codes
    description: Discount promo codes (optional feature)
  - name: Delivery
    description: Delivery person operations (optional feature)

# ─── Security schemes ───────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── Reusable parameters ────────────────────────────────────────

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductVariantIdParam:
      name: productVariantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AddressIdParam:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  # ─── Reusable schemas ───────────────────────────────────────────

  schemas:
    # ── Auth ──
    SignUpRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Secret123!
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        phone:
          type: string
          example: "+1234567890"

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [manager, client, delivery_person]

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 8

    # ── Category ──
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Graphic Tees
        slug:
          type: string
          example: graphic-tees
        description:
          type: string

    # ── Address ──
    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
          nullable: true
          example: Casa
        recipientName:
          type: string
          example: Demo User
        recipientPhone:
          type: string
          example: "+1234567890"
        line1:
          type: string
          example: 123 Main St
        line2:
          type: string
          nullable: true
        city:
          type: string
          example: San Francisco
        stateRegion:
          type: string
          nullable: true
          example: CA
        postalCode:
          type: string
          nullable: true
          example: "94102"
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          example: US
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required: [recipientName, recipientPhone, line1, city, countryCode]
      properties:
        label:
          type: string
          maxLength: 50
        recipientName:
          type: string
          maxLength: 200
        recipientPhone:
          type: string
          maxLength: 30
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        stateRegion:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        isDefault:
          type: boolean
          default: false

    UpdateAddressRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 50
        recipientName:
          type: string
          maxLength: 200
        recipientPhone:
          type: string
          maxLength: 30
        line1:
          type: string
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        stateRegion:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        isDefault:
          type: boolean

    # ── Product ──
    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Mountain Sunset Tee
        slug:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        category:
          $ref: "#/components/schemas/Category"
        primaryImage:
          type: string
          format: uri
          nullable: true
        likesCount:
          type: integer
        isLiked:
          type: boolean
          description: Whether the current user has liked this product (false if not logged in)
        minPrice:
          type: number
          format: float
          description: Lowest variant price for this product
        createdAt:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/ProductImage"
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"

    CreateProductRequest:
      type: object
      required: [name, description, categoryId]
      properties:
        name:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        categoryId:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, disabled]

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicUrl:
          type: string
          format: uri
        altText:
          type: string
        sortOrder:
          type: integer
        isPrimary:
          type: boolean

    # ── Product Variant ──
    ProductVariant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
          example: MST-BLU-L
        sizeName:
          type: string
          example: L
        colorName:
          type: string
          example: Blue
        colorHex:
          type: string
          example: "#0000FF"
        price:
          type: number
          format: float
          example: 29.99
        stock:
          type: integer
          example: 50
        isActive:
          type: boolean

    CreateProductVariantRequest:
      type: object
      required: [sizeId, colorId, sku, price, stock]
      properties:
        sizeId:
          type: integer
          format: int64
        colorId:
          type: integer
          format: int64
        sku:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0

    UpdateProductVariantRequest:
      type: object
      properties:
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          minimum: 0
        isActive:
          type: boolean

    # ── Cart ──
    Cart:
      type: object
      properties:
        id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalAmount:
          type: number
          format: float

    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productVariantId:
          type: integer
          format: int64
        productName:
          type: string
        skuCode:
          type: string
        sizeName:
          type: string
        colorName:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        unitPrice:
          type: number
          format: float
        quantity:
          type: integer
        lineTotal:
          type: number
          format: float

    AddCartItemRequest:
      type: object
      required: [productVariantId, quantity]
      properties:
        productVariantId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    # ── Order ──
    OrderSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
        currentStatus:
          type: string
          enum: [pending, paid, processing, shipped, delivered, cancelled]
        subtotal:
          type: number
          format: float
        discountAmount:
          type: number
          format: float
        totalAmount:
          type: number
          format: float
        paymentMethod:
          type: string
          enum: [payment_link, payment_intent]
          nullable: true
        createdAt:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
            promoCode:
              type: string
              nullable: true
            promoDiscount:
              type: number
              format: float
              nullable: true
            shippingAddress:
              type: object
              properties:
                recipientName:
                  type: string
                recipientPhone:
                  type: string
                line1:
                  type: string
                line2:
                  type: string
                  nullable: true
                city:
                  type: string
                stateRegion:
                  type: string
                  nullable: true
                postalCode:
                  type: string
                countryCode:
                  type: string
            statusHistory:
              type: array
              items:
                $ref: "#/components/schemas/StatusHistoryEntry"

    OrderItem:
      type: object
      properties:
        productName:
          type: string
        skuCode:
          type: string
        sizeName:
          type: string
        colorName:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        quantity:
          type: integer
        unitPrice:
          type: number
          format: float
        lineTotal:
          type: number
          format: float

    StatusHistoryEntry:
      type: object
      properties:
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        changedBy:
          type: string
          nullable: true
          description: User email or "system"
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: integer
          format: int64
        promoCode:
          type: string
          description: Optional promo code to apply

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, shipped, delivered, cancelled]
        reason:
          type: string

    # ── Payment ──
    CreatePaymentIntentResponse:
      type: object
      properties:
        clientSecret:
          type: string
          description: Stripe client secret for frontend confirmation
        paymentIntentId:
          type: string
        amount:
          type: number
          format: float
        currency:
          type: string
          example: usd

    CreatePaymentLinkRequest:
      type: object
      required: [productVariantId, quantity, addressId]
      properties:
        productVariantId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        addressId:
          type: integer
          format: int64

    CreatePaymentLinkResponse:
      type: object
      properties:
        paymentLinkUrl:
          type: string
          format: uri
        orderId:
          type: integer
          format: int64

    # ── Promo Code (optional) ──
    PromoCode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed_amount]
        discountValue:
          type: number
          format: float
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
        usageCount:
          type: integer
        minimumPurchaseAmount:
          type: number
          format: float
          nullable: true
        isActive:
          type: boolean

    CreatePromoCodeRequest:
      type: object
      required: [code, discountType, discountValue, expiresAt, usageLimit]
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed_amount]
        discountValue:
          type: number
          format: float
          minimum: 0.01
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
          minimum: 1
        minimumPurchaseAmount:
          type: number
          format: float
          nullable: true

    # ── Pagination wrapper ──
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer

    # ── Error ──
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
      example:
        statusCode: 400
        message: Validation failed
        error: Bad Request

# ─── Paths ──────────────────────────────────────────────────────────

paths:
  # ── Auth ──────────────────────────────────────────────────────────

  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new client account
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signin:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/signout:
    post:
      tags: [Auth]
      summary: Sign out (invalidate token)
      operationId: signOut
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Signed out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: If the email exists, a reset link was sent
        "429":
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully (email notification sent)
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Categories ────────────────────────────────────────────────────

  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # ── Addresses ─────────────────────────────────────────────────────

  /addresses:
    get:
      tags: [Addresses]
      summary: List current user addresses
      operationId: listAddresses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of current user addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Addresses]
      summary: Create an address for the current user
      operationId: createAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /addresses/{addressId}:
    patch:
      tags: [Addresses]
      summary: Update one of the current user addresses
      operationId: updateAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressRequest"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Addresses]
      summary: Delete one of the current user addresses
      operationId: deleteAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AddressIdParam"
      responses:
        "204":
          description: Address deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Products ──────────────────────────────────────────────────────

  /products:
    get:
      tags: [Products]
      summary: List products with pagination (public)
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by category
        - name: search
          in: query
          schema:
            type: string
          description: Search by product name
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductSummary"

    post:
      tags: [Products]
      summary: Create a product (manager only)
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (not a manager)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}:
    get:
      tags: [Products]
      summary: Get product details (public)
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      responses:
        "200":
          description: Product detail with variants and images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [Products]
      summary: Update a product (manager only)
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
